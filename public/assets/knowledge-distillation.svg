<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="460" height="170">
  <!-- Teacher network (larger) -->
  <g stroke="#6f1a07" stroke-width="1" opacity="0.35">
    <line x1="60" y1="35" x2="100" y2="85" />
    <line x1="60" y1="85" x2="100" y2="85" />
    <line x1="60" y1="135" x2="100" y2="85" />
    <line x1="60" y1="35" x2="100" y2="40" />
    <line x1="60" y1="85" x2="100" y2="40" />
    <line x1="60" y1="35" x2="100" y2="130" />
    <line x1="60" y1="135" x2="100" y2="130" />
    <line x1="100" y1="40" x2="140" y2="85" />
    <line x1="100" y1="85" x2="140" y2="85" />
    <line x1="100" y1="130" x2="140" y2="85" />
  </g>
  <g fill="#6f1a07">
    <circle cx="60" cy="35" r="7" />
    <circle cx="60" cy="85" r="7" />
    <circle cx="60" cy="135" r="7" />
    <circle cx="100" cy="40" r="6" />
    <circle cx="100" cy="85" r="6" />
    <circle cx="100" cy="130" r="6" />
    <circle cx="140" cy="85" r="7" fill="#c1531f" />
  </g>
  <text x="100" y="160" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2" fill="#33303a" opacity="0.85">TEACHER</text>

  <!-- Distillation arrow -->
  <g stroke="#33303a" stroke-width="2" opacity="0.75">
    <line x1="168" y1="85" x2="278" y2="85" stroke-dasharray="5 5" />
    <path d="M278 85 L266 78 M278 85 L266 92" fill="none" />
  </g>
  <text x="223" y="65" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#33303a" opacity="0.6">DISTILL</text>

  <!-- Student network (smaller) -->
  <g stroke="#6f1a07" stroke-width="1" opacity="0.35">
    <line x1="325" y1="60" x2="360" y2="85" />
    <line x1="325" y1="110" x2="360" y2="85" />
    <line x1="360" y1="85" x2="395" y2="60" />
    <line x1="360" y1="85" x2="395" y2="110" />
  </g>
  <g fill="#6f1a07">
    <circle cx="325" cy="60" r="5" />
    <circle cx="325" cy="110" r="5" />
    <circle cx="360" cy="85" r="6" fill="#c1531f" />
    <circle cx="395" cy="60" r="5" />
    <circle cx="395" cy="110" r="5" />
  </g>
  <text x="360" y="160" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2" fill="#33303a" opacity="0.85">STUDENT</text>
</svg>
